name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - run: npm run lint --workspace=web
      - run: npm run typecheck --workspace=web
      - run: npm run test --workspace=web
      - run: npm run build --workspace=web

  api:
    name: API (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - run: npm run lint --workspace=api
      - run: npm run typecheck --workspace=api
      - run: npm run test --workspace=api
      - run: npm run build --workspace=api

  cad-worker:
    name: cad-worker (ruff, tests, health)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cad-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/cad-worker/pyproject.toml

      - name: Install package + dev deps
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests cad_worker_server.py

      - name: Pytest
        run: pytest

      - name: Health CLI smoke
        run: python -m cad_worker health
