<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-technical-pattern {
            background-color: #f8f9fa;
            background-image: radial-gradient(#d1d5db 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }
        .blueprint-grid {
            background-image: 
                linear-gradient(to right, rgba(226, 232, 240, 0.5) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(226, 232, 240, 0.5) 1px, transparent 1px);
            background-size: 80px 80px;
        }
    </style>
</head>
<body class="bg-technical-pattern min-h-screen flex items-center justify-center font-body-md text-on-surface">
<!-- Hero Background Element -->
<div class="fixed inset-0 pointer-events-none blueprint-grid z-0"></div>
<div class="fixed top-0 left-0 w-full h-1 bg-primary"></div>
<main class="relative z-10 w-full max-w-[440px] px-6">
<!-- Brand Header -->
<div class="flex flex-col items-center mb-10">
<div class="bg-primary text-on-primary w-14 h-14 flex items-center justify-center rounded-lg shadow-lg mb-4">
<span class="material-symbols-outlined text-[32px]">architecture</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">BluePrint Admin</h1>
<p class="font-technical-label text-technical-label text-outline uppercase mt-1">Technical Division Portal</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-8 shadow-[0px_10px_25px_rgba(0,74,153,0.08)]">
<div class="mb-8">
<h2 class="font-headline-lg text-headline-md text-on-surface">Acceso al Portal de Proyectos</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2">Ingrese sus credenciales técnicas para continuar.</p>
</div>
<form class="space-y-6">
<!-- Username Field -->
<div class="space-y-2">
<label class="font-button text-button text-on-surface block" for="username">Nombre de usuario o Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all font-body-md" id="username" name="username" placeholder="admin.division@blueprint.com" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-button text-button text-on-surface block" for="password">Contraseña</label>
<a class="font-technical-label text-technical-label text-primary hover:underline" href="#">¿OLVIDÓ SU CLAVE?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all font-body-md" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-2">
<input class="w-4 h-4 text-primary border-outline-variant rounded focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant" for="remember">Mantener sesión iniciada</label>
</div>
<!-- CTA Button -->
<button class="w-full bg-primary text-on-primary py-4 rounded-lg font-button text-button hover:bg-primary-container hover:text-on-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-sm" type="submit">
<span>INICIAR SESIÓN</span>
<span class="material-symbols-outlined text-[18px]">login</span>
</button>
</form>
<div class="mt-8 pt-6 border-t border-outline-variant flex flex-col items-center gap-4">
<p class="font-body-sm text-body-sm text-on-surface-variant">¿No tiene acceso al sistema?</p>
<button class="font-button text-button text-primary border border-primary px-6 py-2 rounded hover:bg-surface-container-low transition-colors uppercase">
                    Solicitar Credenciales
                </button>
</div>
</div>
<!-- Footer Info -->
<footer class="mt-12 text-center space-y-2">
<p class="font-technical-label text-technical-label text-outline">v2.4.0-STABLE | BLUEPRINT SYSTEMS INC.</p>
<div class="flex justify-center gap-6 text-[11px] font-technical-label text-outline uppercase">
<a class="hover:text-primary transition-colors" href="#">Seguridad</a>
<a class="hover:text-primary transition-colors" href="#">Términos</a>
<a class="hover:text-primary transition-colors" href="#">Soporte Técnico</a>
</div>
</footer>
</main>
<!-- Side Illustration (Hidden on mobile) -->
<div class="hidden lg:block fixed right-12 bottom-12 w-[320px] h-[320px] opacity-20 pointer-events-none">
<img alt="Architectural Blueprint" class="w-full h-full object-contain grayscale" data-alt="A detailed architectural blueprint drawing spread across a clean white desk, showing intricate structural lines, measurements, and technical annotations. The image has a high-key lighting setup with soft shadows and a professional, minimalist aesthetic. The color palette is dominated by sharp blacks and cool grays, reflecting a sophisticated engineering environment focused on precision and technical mastery." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDkcL5EIUaBnki0RG1TmhhWBOpbSk6Ubnf8sbOWAhdCA1H6tEXagwez9NvoalPSreT8gjOgozfAt-ISQ9woNdC0ae46WMPcP3ORi2hwizu92yLEBjr7ziCmx5CL4DWNg9MbH67cuUZpRahcAN3Od661rWLYpCV-mb8pxqqBJM0a5T7kUs6Ly2iVrehL3OV1YK3kZnMMgKaxOD_hTC7pg50CY4jMxnNwGk6EBw2DXgW6zTY1EAi9F7Ead82m6KKll5-Ed8JEsbnT48Kg"/>
</div>
</body></html>
