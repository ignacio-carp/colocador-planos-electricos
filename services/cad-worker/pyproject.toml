[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-worker"
version = "0.0.0"
description = "Skeleton CAD worker (MVP) — provides CLI entrypoint and healthcheck."
requires-python = ">=3.12"
dependencies = [
  "ezdxf>=1.3,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
cad-worker = "cad_worker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

