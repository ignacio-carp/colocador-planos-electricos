[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-worker"
version = "0.1.0"
description = "Minimal CAD worker CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cad-worker = "cad_worker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cad_worker*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-worker"
version = "0.0.0"
description = "Skeleton CAD worker (MVP) — provides CLI entrypoint and healthcheck."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cad-worker = "cad_worker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff.lint]
select = ["E", "F", "I"]

