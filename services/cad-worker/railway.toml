# Railway service config — set Root Directory to services/cad-worker in the dashboard.
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "pip install -r requirements.txt && pip install -e . && uvicorn cad_worker_server:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
